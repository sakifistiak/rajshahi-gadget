<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Visa Official Mark -->
  <g transform="translate(10, 18)">
    <rect width="80" height="34" rx="4" fill="#1A1F71"/>
    <text x="40" y="24" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="20" fill="#FFFFFF" letter-spacing="1">VISA</text>
  </g>
  <!-- Mastercard Official Mark -->
  <g transform="translate(100, 18)">
    <rect width="60" height="34" rx="4" fill="#222222"/>
    <circle cx="23" cy="17" r="10" fill="#EB001B"/>
    <circle cx="37" cy="17" r="10" fill="#F79E1B" fill-opacity="0.9"/>
    <path d="M30 10.3a9.9 9.9 0 010 13.4 9.9 9.9 0 010-13.4z" fill="#FF5F00"/>
  </g>
  <!-- Amex / Bank -->
  <g transform="translate(170, 18)">
    <rect width="60" height="34" rx="4" fill="#0077A6"/>
    <text x="30" y="22" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="0.5">AMEX</text>
  </g>
</svg>
